# SQL Server 2022 para desenvolvimento e testes.
# Mac com Apple Silicon: o Docker Desktop precisa de "Apple Virtualization framework" + "Rosetta" ativos
# (Settings > General) para correr esta imagem x86.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: parceiros-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Parceiros#Dev2026"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - parceiros-dados:/var/opt/mssql
volumes:
  parceiros-dados:
